<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Расчет Денежной Энергии</title>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			font-family: 'Inter', system-ui, sans-serif;
			background: linear-gradient(135deg, #ffd4a3 0%, #ff6b6b 100%);
			min-height: 100vh;
			color: #333333;
			padding: 30px 1rem 2rem 1rem;
		}
		
		.container {
			max-width: 800px;
			margin: 0 auto;
		}
		
		.money-calc-section {
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(10px);
			border: 1px solid rgba(210, 105, 30, 0.2);
			border-radius: 1rem;
			padding: 3rem;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
		}
		
		.money-calc-section h2 {
			text-align: center;
			color: #333333;
			margin-bottom: 2rem;
			font-size: 2rem;
			font-weight: 700;
		}
		
		.input-group {
			text-align: center;
			margin-bottom: 2rem;
		}
		
		#birthDate {
			padding: 1rem;
			border-radius: 0.5rem;
			border: 1px solid #ddd;
			font-size: 1.1rem;
			margin-right: 1rem;
			width: 200px;
		}
		
		.calculate-btn {
			padding: 1rem 2rem;
			background: linear-gradient(135deg, #d2691e, #8b4513);
			color: white;
			border: none;
			border-radius: 0.5rem;
			font-size: 1.1rem;
			cursor: pointer;
			font-weight: 600;
			transition: all 0.3s ease;
		}
		
		.calculate-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 25px rgba(210, 105, 30, 0.3);
		}
		
		#resultBlock {
			display: none;
			margin-top: 30px;
			text-align: center;
		}
		
		#resultBlock h3 {
			margin-bottom: 1rem;
		}
		
		#energyName {
			color: #d4af37;
			font-weight: 600;
		}
		
		.image-container {
			margin: 2rem 0;
			display: flex;
			justify-content: center;
		}
		
		#energyImage {
			max-width: 300px;
			border-radius: 15px;
			border: 2px solid #d4af37;
			box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
		}
		
		#energyDescription {
			margin: 20px 0;
			font-size: 1.1rem;
			color: #666666;
			max-width: 600px;
			margin-left: auto;
			margin-right: auto;
		}
		
		.cta-button {
			margin-top: 2rem;
		}
		
		.cta-button a {
			font-size: 1.2rem;
			padding: 1.2rem 2.5rem;
			background: linear-gradient(135deg, #d2691e, #8b4513);
			color: white;
			text-decoration: none;
			border-radius: 0.5rem;
			display: inline-block;
			transition: all 0.3s ease;
		}
		
		.cta-button a:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 25px rgba(210, 105, 30, 0.3);
		}
		
		@media (max-width: 768px) {
			body {
				padding: 1rem 0.5rem;
			}
			
			.money-calc-section {
				padding: 2rem 1.5rem;
			}
			
			.money-calc-section h2 {
				font-size: 1.5rem;
			}
			
			#birthDate {
				width: 150px;
				margin-right: 0.5rem;
				font-size: 1rem;
			}
			
			.calculate-btn {
				padding: 1rem 1.5rem;
				font-size: 1rem;
			}
			
			#energyImage {
				max-width: 250px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<section class="money-calc-section">
			<h2>Расчет камня ТВОЕЙ Денежной Энергии!</h2>
			
			<div class="input-group">
				<input type="text" id="birthDate" placeholder="дд.мм.гггг" maxlength="10">
				<button class="calculate-btn" onclick="calculateMoneyEnergy()">Рассчитать</button>
			</div>

			<div id="resultBlock">
				<h3>Твоя денежная энергия — <span id="energyName"></span></h3>
				
				<div class="image-container">
					<img id="energyImage" src="" alt="Ваша энергия">
				</div>

				<p id="energyDescription"></p>

				<div class="cta-button">
					<a href="https://t.me/asya_for_creators_bot?start=dl-1774351895400" target="_blank">
						Получить полный гайд по камням
					</a>
				</div>
			</div>
		</section>
	</div>
	
	<script>
		// Названия арканов
		const arcanaNames = {
			1: "Маг", 2: "Верховная Жрица", 3: "Императрица", 4: "Император", 5: "Верховный Жрец",
			6: "Влюбленные", 7: "Колесница", 8: "Сила", 9: "Отшельник", 10: "Колесо Фортуны",
			11: "Справедливость", 12: "Повешенный", 13: "Смерть", 14: "Умеренность", 15: "Дьявол",
			16: "Башня", 17: "Звезда", 18: "Луна", 19: "Солнце", 20: "Суд", 21: "Мир", 22: "Шут"
		};

		// URL картинок из репозитория Vercel
		const arcanas = {
			1: "/images/money_stone/money_1.jpg",
			2: "/images/money_stone/money_2.jpg",
			3: "/images/money_stone/money_3.jpg",
			4: "/images/money_stone/money_4.jpg",
			5: "/images/money_stone/money_5.jpg",
			6: "/images/money_stone/money_6.jpg",
			7: "/images/money_stone/money_7.jpg",
			8: "/images/money_stone/money_8.jpg",
			9: "/images/money_stone/money_9.jpg",
			10: "/images/money_stone/money_10.jpg",
			11: "/images/money_stone/money_11.jpg",
			12: "/images/money_stone/money_12.jpg",
			13: "/images/money_stone/money_13.jpg",
			14: "/images/money_stone/money_14.jpg",
			15: "/images/money_stone/money_15.jpg",
			16: "/images/money_stone/money_16.jpg",
			17: "/images/money_stone/money_17.jpg",
			18: "/images/money_stone/money_18.jpg",
			19: "/images/money_stone/money_19.jpg",
			20: "/images/money_stone/money_20.jpg",
			21: "/images/money_stone/money_21.jpg",
			22: "/images/money_stone/money_22.jpg"
		};

		// Делаем функцию глобальной
		window.calculateMoneyEnergy = function() {
			const input = document.getElementById('birthDate').value;
			const parts = input.split('.');
			
			if (parts.length !== 3) {
				alert("Введите дату в формате дд.мм.гггг");
				return;
			}

			const month = parseInt(parts[1]);
			const yearStr = parts[2];

			// 1. Считаем сумму цифр года (например 1985 -> 1+9+8+5 = 23)
			let yearSum = yearStr.split('').reduce((acc, digit) => acc + parseInt(digit), 0);
			
			// 2. Складываем Месяц + Сумма года
			let total = month + yearSum;

			// 3. Правило 22 (вычитаем 22, пока число не станет <= 22)
			while (total > 22) {
				total -= 22;
			}

			// Показываем результат
			document.getElementById('energyName').innerText = arcanaNames[total];
			
			const img = document.getElementById('energyImage');
			const imagePath = arcanas[total];
			
			img.src = imagePath;
			img.alt = `Энергия ${arcanaNames[total]}`;
			
			document.getElementById('resultBlock').style.display = 'block';
			
			// Плавный скролл к результату
			document.getElementById('resultBlock').scrollIntoView({ behavior: 'smooth' });
		};

		// Маска для ввода даты (автоматические точки)
		document.addEventListener('DOMContentLoaded', function() {
			const birthDateInput = document.getElementById('birthDate');
			if (birthDateInput) {
				birthDateInput.addEventListener('input', function (e) {
					let v = e.target.value.replace(/\D/g, '').slice(0, 8);
					if (v.length >= 2) v = v.slice(0, 2) + '.' + v.slice(2);
					if (v.length >= 5) v = v.slice(0, 5) + '.' + v.slice(5);
					e.target.value = v;
				});
			}
		});
	</script>
</body>
</html>
